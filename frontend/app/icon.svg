      <stop offset="0%" stop-color="#D5851F"/>
      <stop offset="50%" stop-color="#E4A247"/>
      <stop offset="100%" stop-color="#87A96B"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#D5851F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded rect badge -->
